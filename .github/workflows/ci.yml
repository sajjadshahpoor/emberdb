name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build (release)
        run: make all

      - name: Run tests (release)
        run: make test

      - name: Clean
        run: make clean

      - name: Build and run tests under ASan/UBSan
        run: make debug
